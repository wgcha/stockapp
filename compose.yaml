services:
  stock-guide-agent:
    build: .
    env_file:
      - ${AGENT_ENV_FILE:-.env}
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - stock-guide-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  stock-guide-data:
