[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-guide-agent"
version = "0.1.0"
description = "Natural-language portfolio intent parser and risk guardrails"
requires-python = ">=3.11"
dependencies = [
    "exchange_calendars==4.12",
    "pandas==2.3.3",
    "python-dotenv==1.2.3",
]

[project.scripts]
stock-guide-agent = "stock_guide_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
